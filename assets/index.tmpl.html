<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>openLoop</title>
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <style>
      body {{
        margin: 0;
        color: #222;
        background: #fff;
        font-family: system-ui, sans-serif;
        font-size: 1.125rem;
        line-height: 1.6;
      }}

      #intro {{
        position: relative;
        display: block;
        width: 100%;
        height: 100svh;
        padding: 0;
        border: 0;
        color: #fff;
        background: #000;
        cursor: pointer;
        font: inherit;
      }}

      #intro:focus-visible {{
        outline: 3px solid #fff;
        outline-offset: -6px;
      }}

      video {{
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }}

      article {{
        max-width: 42rem;
        margin: 0 auto;
        padding: 3rem 1.5rem;
      }}

      nav {{
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        margin-bottom: 2rem;
        font-size: 0.875rem;
      }}

      nav a[aria-current="page"] {{
        color: #999;
      }}

      #intro[hidden],
      [hidden] {{
        display: none;
      }}
    </style>
  </head>
  <body>
    <main>
      <button id="intro" type="button" aria-label="Read about openLoop">
        <video autoplay muted loop playsinline preload="none" aria-hidden="true">
          <source src="open-loop.mp4" type="video/mp4">
        </video>
      </button>

{pages}
    </main>

    <script>
      const language = navigator.language.toLowerCase().split("-")[0] === "fr" ? "fr" : "en";
      const intro = document.getElementById("intro");
      let content = document.getElementById(language + "/index");
      const video = document.querySelector("video");

      document.documentElement.lang = language;
      if (language === "fr") {{
        intro.setAttribute("aria-label", "À propos d’openLoop");
      }}

      function showPage(page) {{
        content.hidden = true;
        content = page;
        video.pause();
        intro.hidden = true;
        content.hidden = false;
        document.documentElement.lang = content.lang;
        content.focus();
        window.scrollTo(0, 0);
      }}

      intro.addEventListener("click", () => {{
        showPage(content);
      }});

      document.addEventListener("click", (event) => {{
        if (event.defaultPrevented) return;
        const link = event.target.closest("a[data-page]");
        if (link) {{
          event.preventDefault();
          if (link.ariaCurrent === "page") return;
          const page = document.getElementById(link.dataset.page);
          if (page) showPage(page);
          return;
        }}

        if (
          content.hidden ||
          event.target.closest("a, button, input, select, textarea, label, summary, [contenteditable]")
        ) {{
          return;
        }}

        content.hidden = true;
        intro.hidden = false;
        video.play();
        intro.focus();
      }});
    </script>
  </body>
</html>
