<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Openloop</title>
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <style>
      body {
        margin: 0;
        color: #222;
        background: #fff;
        font-family: system-ui, sans-serif;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      #intro {
        position: relative;
        display: block;
        width: 100%;
        height: 100svh;
        padding: 0;
        border: 0;
        color: #fff;
        background: #000;
        cursor: pointer;
        font: inherit;
      }

      #intro:focus-visible {
        outline: 3px solid #fff;
        outline-offset: -6px;
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      article {
        max-width: 42rem;
        margin: 0 auto;
        padding: 3rem 1.5rem;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        margin-bottom: 2rem;
        font-size: 0.875rem;
      }

      nav a[aria-current="page"] {
        color: #999;
        pointer-events: none;
      }

      #intro[hidden],
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <button id="intro" type="button" aria-label="Read about Openloop">
        <video autoplay muted loop playsinline preload="none" aria-hidden="true">
          <source src="open-loop.mp4" type="video/mp4">
        </video>
      </button>

<article id="en/index" lang="en" tabindex="-1" hidden>
<h1>Welcome</h1>
<p>Read <a href="#" data-page="en/history">history</a>.</p>
<nav aria-label="Pages"><a href="#" data-page="en/index" aria-current="page">index</a> <a href="#" data-page="en/history">history</a></nav>
</article>
<article id="en/history" lang="en" tabindex="-1" hidden>
<h1>History</h1>
<p><a href="#" data-page="fr/history">Français</a></p>
<nav aria-label="Pages"><a href="#" data-page="en/index">index</a> <a href="#" data-page="en/history" aria-current="page">history</a></nav>
</article>
<article id="fr/index" lang="fr" tabindex="-1" hidden>
<h1>Bienvenue</h1>
<p>Lire <a href="#" data-page="fr/histoire">l’histoire</a>.</p>
<nav aria-label="Pages"><a href="#" data-page="fr/index" aria-current="page">index</a> <a href="#" data-page="fr/history">history</a></nav>
</article>
<article id="fr/history" lang="fr" tabindex="-1" hidden>
<h1>Histoire</h1>
<p><a href="#" data-page="fr/index">Accueil</a></p>
<nav aria-label="Pages"><a href="#" data-page="fr/index">index</a> <a href="#" data-page="fr/history" aria-current="page">history</a></nav>
</article>
    </main>

    <script>
      const language = navigator.language.toLowerCase().split("-")[0] === "fr" ? "fr" : "en";
      const intro = document.getElementById("intro");
      let content = document.getElementById(language + "/index");
      const video = document.querySelector("video");

      document.documentElement.lang = language;
      if (language === "fr") {
        intro.setAttribute("aria-label", "À propos d’Openloop");
      }

      function showPage(page) {
        content.hidden = true;
        content = page;
        video.pause();
        intro.hidden = true;
        content.hidden = false;
        document.documentElement.lang = content.lang;
        content.focus();
        window.scrollTo(0, 0);
      }

      intro.addEventListener("click", () => {
        showPage(document.getElementById(language + "/index"));
      });

      document.addEventListener("click", (event) => {
        if (event.defaultPrevented) return;
        const link = event.target.closest("a[data-page]");
        if (link) {
          event.preventDefault();
          const page = document.getElementById(link.dataset.page);
          if (page) showPage(page);
          return;
        }

        if (
          content.hidden ||
          !content.id.endsWith("/index") ||
          event.target.closest("a, button, input, select, textarea, label, summary, [contenteditable]")
        ) {
          return;
        }

        content.hidden = true;
        intro.hidden = false;
        video.play();
        intro.focus();
      });
    </script>
  </body>
</html>
