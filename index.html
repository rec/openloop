<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Openloop</title>
    <style>
      body {
        margin: 0;
        color: #222;
        background: #fff;
        font-family: system-ui, sans-serif;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      #intro {
        position: relative;
        display: block;
        width: 100%;
        height: 100svh;
        padding: 0;
        border: 0;
        color: #fff;
        background: #000;
        cursor: pointer;
        font: inherit;
      }

      #intro:focus-visible {
        outline: 3px solid #fff;
        outline-offset: -6px;
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      article {
        max-width: 42rem;
        margin: 0 auto;
        padding: 3rem 1.5rem;
      }

      #intro[hidden],
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <button id="intro" type="button" aria-label="Read about Openloop">
        <video autoplay muted loop playsinline aria-hidden="true">
          <source src="open-loop.mp4" type="video/mp4">
        </video>
      </button>

      <!-- Replace this section with your English text. -->
      <article id="en" lang="en" tabindex="-1" hidden>
        <h1>Openloop</h1>
        <p>Welcome to Openloop.</p>
        <p>The English text will appear here.</p>
      </article>

      <!-- Replace this section with your French text. -->
      <article id="fr" lang="fr" tabindex="-1" hidden>
        <h1>Openloop</h1>
        <p>Bienvenue sur Openloop.</p>
        <p>Le texte français apparaîtra ici.</p>
      </article>
    </main>

    <script>
      const language = navigator.language.toLowerCase().split("-")[0] === "fr" ? "fr" : "en";
      const intro = document.getElementById("intro");
      const content = document.getElementById(language);
      const video = document.querySelector("video");

      document.documentElement.lang = language;
      if (language === "fr") {
        intro.setAttribute("aria-label", "À propos d’Openloop");
      }

      intro.addEventListener("click", () => {
        video.pause();
        intro.hidden = true;
        content.hidden = false;
        content.focus();
      });
    </script>
  </body>
</html>
